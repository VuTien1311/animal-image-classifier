[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-classifier"
version = "1.0.0"
description = "Animals-10 image classification: CNN baseline -> fine-tuned ConvNeXt, distillation, CLIP, ONNX serving."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10", "pyyaml>=6"]

[project.urls]
Repository = "https://github.com/VuTien1311/animal-image-classifier"

[project.optional-dependencies]
# Training, evaluation, analysis and ONNX export / quantisation.
train = [
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tensorboard>=2.14",
    "tqdm>=4.66",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime>=1.17",
]
# The REST API only: no PyTorch needed.
serve = ["onnxruntime>=1.17", "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
demo = ["gradio>=4.0"]
clip = ["open_clip_torch>=2.24"]
dev = ["pytest>=8", "ruff==0.17.1", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
